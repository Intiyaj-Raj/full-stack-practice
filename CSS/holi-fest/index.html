<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>happy holi by intiyaj</title>

    <style>
        /* ---------- BODY ---------- */
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff4e50, #fc0, #f9d423, #00c9ff, #92fe9d);
            background-size: 400% 400%;
            animation: bgMove 8s infinite alternate;
            font-family: Arial, sans-serif;
        }

        /* ---------- BACKGROUND ANIMATION ---------- */
        @keyframes bgMove {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        /* ---------- HEADING ---------- */
        h1 {
            font-size: 70px;
            color: white;
            text-shadow: 0 0 20px yellow, 0 0 40px red;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        /* ---------- SPLASH ---------- */
        .splash {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            opacity: 0.7;
            animation: splash 5s infinite ease-in-out;
        }

        @keyframes splash {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .s1 {
            background: #ff0089;
            top: 10%;
            left: 20%;
        }

        .s2 {
            background: #00c9ff;
            top: 60%;
            left: 70%;
        }

        .s3 {
            background: #faff00;
            top: 40%;
            left: 10%;
        }

        .s4 {
            background: #00ff6a;
            top: 20%;
            left: 80%;
        }

        /* ---------- BALLOONS ---------- */
        .ballon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            animation: rise 3.5s infinite linear;
        }

        @keyframes rise {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-110vh);
            }
        }

        .b1 {
            left: 5%;
            background: #ff1493;
            animation-delay: 0.2s;
        }

        .b2 {
            left: 18%;
            background: #00c9ff;
            animation-delay: 0.7s;
        }

        .b3 {
            left: 12%;
            background: #ffd700;
            animation-delay: 1.2s;
        }

        .b4 {
            left: 28%;
            background: #00ff7f;
            animation-delay: 1.7s;
        }

        .b5 {
            left: 40%;
            background: #ff8c00;
            animation-delay: 2.2s;
        }

        .b6 {
            left: 55%;
            background: #8a2be2;
            animation-delay: 2.7s;
        }

        .b7 {
            left: 62%;
            background: #ff4e50;
            animation-delay: 3.2s;
        }

        .b8 {
            left: 75%;
            background: #00bfff;
            animation-delay: 3.7s;
        }

        .b9 {
            left: 85%;
            background: #adff2f;
            animation-delay: 4.2s;
        }

        /* ---------- FOOTER ---------- */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            padding: 30px 20px;
            z-index: 1000;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Happy Holi</h1>

    <div class="splash s1"></div>
    <div class="splash s2"></div>
    <div class="splash s3"></div>
    <div class="splash s4"></div>

    <div class="ballon b1"></div>
    <div class="ballon b2"></div>
    <div class="ballon b3"></div>
    <div class="ballon b4"></div>
    <div class="ballon b5"></div>
    <div class="ballon b6"></div>
    <div class="ballon b7"></div>
    <div class="ballon b8"></div>
    <div class="ballon b9"></div>

    <footer>
        &copy; Intiyaj | 9117392461 | intiyajraj786@gmail.com
    </footer>

</body>

</html>
