<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <section class="contact">

        <div class="left">

            <h1>Contact Us</h1>

            <p>
                Spotted something you love? Don’t overthink it; we’d love <br> to make it yours.
                Drop us a message using any of <br>the options below.
            </p>

            <div class="social">

                <div class="icon">
                    <i class="fa-brands fa-instagram"></i>
                    <span style="color: #e1306c;">@SAYOORI.WOMAN</span>
                </div>

                <div class="icon facebook">
                    <i class="fa-brands fa-facebook"></i>
                    <span style="color: #3b5998;">SAYOORI WOMAN</span>
                </div>

                <div class="icon">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span style="color:#25D366;">+91 9310129058</span>
                </div>

            </div>

        </div>

        <div class="right">

            <form>

                <div class="row">
                    <div class="inputBox">
                        <label>First Name <span style="color: #e1306c;">*</span></label>
                        <input type="text" required>
                    </div>

                    <div class="inputBox">
                        <label>Phone Number</label>
                        <input type="text">
                    </div>
                </div>
                <div>
                    <p style="color: #777;">
                        This field is required. Please <br>input your name.
                    </p>
                </div>
                <label>Message</label>
                <textarea name="" id="" rows="6"></textarea>

                <button type="submit">Submit</button>

            </form>

        </div>

    </section>

</body>

</html>
