<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mcLaren</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body onload="home()">

    <header>
        <div class="right-nav">
            <div class="menu-bar">
                <span class="s1"></span>
                <span></span>
                <span class="s2"></span>
            </div>
            <nav>
                <div class="menu-list">
                    <ul>
                        <li><button onclick="home()">Home</button></li>
                        <li><button onclick="showRacingVid()">Racing</button></li>
                        <li><button onclick="showAutomotiveVid()">Automotive</button></li>
                        <li><button onclick="showGolfVid()">Golf</button></li>
                        <li><button onclick="showCorporateVid()">Corporate</button></li>
                        <li><button onclick="showCarrierVid()">Careers</button></li>
                        <li><button onclick="showStoreVid()">Store</button></li>
                    </ul>
                </div>
            </nav>
        </div>
        <div class="logo">
            <img src="./logo.svg">
        </div>
    </header>

    <div class="homeSection">
        <div class="home home-video">
            <video src="./video/home.mp4" autoplay loop muted></video>
        </div>
        <div class="multi-use-btn home-btn">
            <a href="https://www.mclaren.com/racing/">Racing</a>
            <a href="https://cars.mclaren.com/gl_en">Automotive</a>
        </div>
    </div>

    <section class="racing-section">
        <div class="racing-video home-video">
            <video src="./video/racing.mp4" autoplay muted loop></video>
        </div>
        <div class="multi-use-btn rbtn">
            <a href="https://www.mclaren.com/racing/formula-1/"> Formula 1</a>
            <a href="https://www.mclaren.com/racing/indycar/">IndyCar</a>
            <a href="https://www.mclaren.com/racing/endurance/">Endurance</a>
        </div>
    </section>

    <section class="automotive-section">
        <div class="automotive home-video">
            <video src="./video/automotive.mp4" muted loop autoplay></video>
        </div>
        <div class="multi-use-btn automotive-btn">
            <a href="https://cars.mclaren.com/gl_en">Automotive</a>
            <a href="https://cars.mclaren.com/gl_en/W1">McLaren W1</a>
        </div>
    </section>

    <section class="golf-section">
        <div class="golf home-video">
            <video src="./video/golf.mp4" muted autoplay loop></video>
        </div>
        <div class="multi-use-btn golf-btn">
            <a href="https://mclarengolf.com/">DISCOVER MORE</a>
        </div>
    </section>

    <section class="corporate-section">
        <div class="corporate home-video">
            <video src="./video/corporatte.mp4" muted autoplay loop></video>
        </div>
        <div class="multi-use-btn corporate-btn">
            <a href="https://cars.mclaren.com/gl_en/corporate">Corporate</a>
        </div>
    </section>
    <section class="career-section">
        <div class="career home-video">
            <video src="./video/career.mp4" muted autoplay loop></video>
        </div>
        <div class="multi-use-btn career-btn">
            <a href="https://racingcareers.mclaren.com/">Racing Careers</a>
            <a href="https://cars.mclaren.com/uk_en/careers">Automotive Careers</a>
        </div>
    </section>
    <section class="store-section">
        <div class="store home-video">
            <video src="./video/store.mp4" muted autoplay loop></video>
        </div>
        <div class="multi-use-btn store-btn">
            <a href="https://store.mclaren.com/en/indycar/">Shop now</a>
        </div>
    </section>
    <script src="./script.js"></script>
</body>

</html>
