<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            width: 100%;
            height: 65px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .right-nav {
            background: rgb(0, 0, 0, 0.8);
            width: 85%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            clip-path: polygon(0 0, 100% 0%, 93% 100%, 0% 100%);
        }



        .menu-bar {
            padding: 0 40px;
            width: 20%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            height: 100%;
        }

        .menu-bar span {
            display: block;
            width: 28px;
            height: 2px;
            background: white;
            transition: 0.3s;
        }


        .menu-bar:hover span {
            transform: translateX(66px);
        }

        .menu-bar:hover .s2 {
            transform: translateX(-66px);
        }

        nav {
            width: 75%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-list {
            width: 90%;
        }

        .menu-list ul {
            display: flex;
            list-style: none;
            justify-content: space-evenly;
        }

        .menu-list ul li a {
            text-decoration: none;
            color: white;
            font-size: 14px;
        }

        .logo {
            background: transparent;
            z-index: 999;
            display: flex;
            align-items: center;
            padding: 0 40px;
            width: 20%;
        }

        .logo img {
            width: 100%;

        }

        .home-video {
            width: 100%;
            height: 100vh;
        }

        .home-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <header>
        <div class="right-nav">
            <div class="menu-bar">
                <span class="s1"></span>
                <span></span>
                <span class="s2"></span>
            </div>
            <nav>
                <div class="menu-list">
                    <ul>
                        <li><a href="#">Home</a></li>
                        <li><a href="#">Racing</a></li>
                        <li><a href="#">Automotive</a></li>
                        <li><a href="#">Golf</a></li>
                        <li><a href="#">Corporate</a></li>
                        <li><a href="#">Careers</a></li>
                        <li><a href="#">Store</a></li>
                    </ul>
                </div>
            </nav>
        </div>
        <div class="logo">
            <img src="./logo.svg">
        </div>
    </header>

    <div class="home-video">
        <video src="./home.mp4" autoplay loop muted></video>
    </div>

</body>

</html>
