<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mcLaren</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <div class="right-nav">
            <div class="menu-bar">
                <span class="s1"></span>
                <span></span>
                <span class="s2"></span>
            </div>
            <nav>
                <div class="menu-list">
                    <ul>
                        <li><button onclick="home()">Home</button></li>
                        <li><button onclick="showRacingVid()">Racing</button></li>
                        <li><button onclick="showAutomotiveVid()">Automotive</button></li>
                        <li><button onclick="showGolfVid()">Golf</button></li>
                        <li><button onclick="showCorporateVid()">Corporate</button></li>
                        <li><button onclick="showCarrierVid()">Careers</button></li>
                        <li><button onclick="showStoreVid()">Store</button></li>
                    </ul>
                </div>
            </nav>
        </div>
        <div class="logo">
            <img src="./logo.svg">
        </div>
    </header>

    <div class="homeSection">
        <div class="home home-video">
            <video src="./video/home.mp4" autoplay loop muted></video>
        </div>
        <div class="multi-use-btn">
            <button>Racing</button>
            <button>Automotive</button>
        </div>
    </div>
    <section class="racing-section">
        <div class="racing-video home-video">
            <video src="./video/racing.mp4" autoplay muted loop></video>
        </div>
        <div class="multi-use-btn rbtn">
            <button> Formula 1</button>
            <button>IndyCar</button>
            <button>Endurance</button>
        </div>
    </section>

    <div class="automotive home-video">
        <video src="./video/automotive.mp4" muted loop autoplay></video>
    </div>
    <div class="golf home-video">
        <video src="./video/golf.mp4" muted autoplay loop></video>
    </div>

    <div class="corporate home-video">
        <video src="./video/corporatte.mp4" muted autoplay loop></video>
    </div>

    <div class="career home-video">
        <video src="./video/career.mp4" muted autoplay loop></video>
    </div>

    <div class="store home-video">
        <video src="./video/store.mp4" muted autoplay loop></video>
    </div>
    <script src="./script.js"></script>
</body>

</html>
