<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: white;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            height: 65px;
            align-items: center;
            background: rgb(0, 0, 0, .5);
            padding: 0 40px;
            position: fixed;
            top: 0;
            left: 0;
            backdrop-filter: blur(10px);
        }

        .menu-bar {
            width: 12%;
            cursor: pointer;
        }

        .menu-bar span {
            display: block;
            width: 30px;
            height: 2px;
            background: white;
            margin: 6px 0;
            transition: 0.3s;
        }

        .menu-bar:hover .s1 {
            transform: translateX(10px);
        }

        .menu-bar:hover .s2 {
            transform: translateX(-10px);
        }

        .menu-list {
            width: 65%;
        }

        .menu-list ul {
            width: 100%;
            display: flex;
            list-style: none;
            justify-content: space-evenly;

        }

        .menu-list ul li a {
            text-decoration: none;
            color: white;

        }

        .logo {
            width: 14%;
        }

        .logo img {
            width: 100%;
            object-fit: cover;
            object-position: center;
        }

        .home-video {
            width: 100%;
            height: 100vh;
        }

        .home-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <nav>
        <div class="menu-bar">
            <span class="s1"></span>
            <span></span>
            <span class="s2"></span>
        </div>
        <div class="menu-list">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Racing</a></li>
                <li><a href="#">Automotive</a></li>
                <li><a href="#">GOLF</a></li>
                <li><a href="#">Corporate</a></li>
                <li><a href="#">Careers</a></li>
                <li><a href="#">Store</a></li>
            </ul>
        </div>
        <div class="logo">
            <img src="./logo.svg" alt="">
        </div>
    </nav>
    <div class="home-video">
        <video src="./home.mp4" autoplay loop muted></video>
    </div>
</body>

</html>
