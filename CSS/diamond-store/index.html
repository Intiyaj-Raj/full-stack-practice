<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            background: rgb(255, 246, 246);

        }

        .logo {
            width: 10%;
        }

        .logo img {
            width: 85%;
        }

        .menu-list {
            width: 81%;
        }

        .menu-list ul {
            display: flex;
            width: 100%;
            justify-content: center;
            list-style: none;
            gap: 15px;
        }

        a {
            position: relative;
            text-decoration: none;
            color: #000;
            font-weight: 700;
            font-size: 14px;
            font-family: "Cormorant Infant", serif;
        }

        .menu-list ul li a::before {
            content: "";
            position: absolute;
            width: 0%;
            height: 1.5px;
            bottom: -5px;
            left: 0;
            background-color: #ccaa6b;
            transition: 0.4s ease;
        }

        .menu-list ul li a:hover::before {
            width: 100%;
        }

        .drop-down {
            font-size: 10px;
        }

        .menu-bar i {
            background: #ccaa6b;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
            font-size: 20px;
            display: none;
        }

        .menu-icon {
            width: 9%;
            position: relative;
        }

        .search-bar {
            display: flex;
            position: absolute;
            bottom: -40px;
            right: 100px;
            display: none;
        }

        .search-bar input {
            outline: none;
            border: 1px solid #ccaa6b;
            padding: 10px;
        }

        .search-btn {
            background: #ccaa6b;
            position: relative;
            color: white;
        }

        #up-icon {
            width: 20px;
            position: absolute;
            top: -15px;
            right: 23px;
        }

        .search-icon:hover+.search-bar {
            display: block;
            display: flex;
        }

        .hero-slider {
            margin-top: 108px;
            width: 100%;
            height: 80vh;
            overflow: hidden;
            position: relative;
        }

        .hero-slides {
            display: flex;
            width: 100%;
            height: 100%;
            animation: heroSlide 8s infinite;
        }

        .hero-slides img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-grow: 0;
            flex-shrink: 0;
            flex-basis: 100%;
        }

        @keyframes heroSlide {

            0%,
            20% {
                transform: translateX(0);
            }

            25%,
            40% {
                transform: translateX(-100%);
            }

            45%,
            60% {
                transform: translateX(-200%);
            }

            65%,
            80% {
                transform: translateX(-300%);
            }

            85%,
            100% {
                transform: translateX(-400%);
            }
        }

        .hero-btn {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .hero-btn a i {
            background: white;
            padding: 18px 25px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9),
                0 0 30px rgba(255, 255, 255, 0.7),
                0 0 45px rgba(255, 255, 255, 0.5);
        }

        .stone-section {
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        .stone-heading {
            margin: 40px auto;
        }

        .stone-heading h2 {
            font-size: 45px;
            font-weight: 500;
            letter-spacing: 3px;
        }

        .stone-img {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 50px;
        }

        .stone-img span p {
            padding: 20px 0;
            text-align: center;
            font-family: sans-serif;
        }

        .stone-buy {
            height: 80vh;
            display: grid;
            grid-template-columns: 33% 34% 33%;
            align-items: center;
        }

        .stone-buy span img {
            width: 100%;
            object-fit: cover;
        }

        .stone-buy-img {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .stone-buy-img a {
            outline: none;
            padding: 12px 0;
            border: 2px solid #6c757d;
            width: 75%;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 200;
            font-family: sans-serif;
            margin-top: 30px;
        }

        .stone-buy-text {
            font-family: 'Cormorant Infant';
            text-align: center;
            letter-spacing: 3px;
            line-height: 40px;
        }

        .stone-buy-text h1 {
            font-size: 35px;
        }
    </style>
</head>

<body>

</body>
