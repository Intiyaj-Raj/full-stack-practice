<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Advent+Pro&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            position: relative;
            z-index: 10;
        }

        .logo h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00ffcc;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            --c: #fff;
            background:
                linear-gradient(90deg, #0000 33%, #fff5, #0000 67%) var(--_p, 100%)/300% no-repeat,
                #3f3e3e;
            color: #0000;
            border: none;
            transform: perspective(500px) rotateY(calc(20deg*var(--_i, -1)));
            text-shadow:
                calc(var(--_i, -1)* 0.08em) -.01em 0 var(--c),
                calc(var(--_i, -1)*-0.08em) .01em 2px #0004;
            outline-offset: .1em;
            transition: 0.3s;
            display: inline-block;
            padding: .3em .8em;
            font-family: system-ui, sans-serif;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
        }

        nav a:hover,
        nav a:focus-visible {
            --_p: 0%;
            --_i: 1;
        }

        nav a:active {
            text-shadow: none;
            color: var(--c);
            box-shadow: inset 0 0 9e9q #0005;
            transition: 0s;
            transform: translateX(300px) rotate(360deg);
            background: #00ffcc;
        }

        #hero {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 90vh;
            padding: 50px;
            position: relative;
            overflow: hidden;
            perspective: 1000px;
            z-index: 0;
            background: linear-gradient(160deg, #0a0a0a 0%, #111111 100%);
        }

        .hero-text {
            max-width: 500px;
            z-index: 1;
            animation: floatText 4s ease-in-out infinite;
        }

        .hero-text h2 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .hero-text span {
            color: #00ffcc;
        }

        .hero-text p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        button.hire-me {
            --hue: 76;
            --sat: 100%;
            --lum: 32%;
            display: block;
            border: none;
            padding: 0;
            position: relative;
            width: 9em;
            height: 3em;
            background: none;
            font: 1.5em/3.2em 'Advent Pro', sans-serif;
            filter: contrast(0.5);
            transition: 0.3s;
            cursor: pointer;
        }

        button.hire-me:focus,
        button.hire-me:hover {
            outline: none;
            filter: none;
        }

        button.hire-me:active {
            transform: translateY(0.25rem);
        }

        button.hire-me span {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: block;
        }

        button.hire-me span[aria-hidden="true"] {
            filter:
                drop-shadow(0.125rem 0.1875rem hsl(var(--hue), calc(var(--sat) - 25%), 25%)) drop-shadow(-0.1875rem -0.125rem hsl(var(--hue), calc(var(--sat) - 41%), 63%)) drop-shadow(1.5rem 1.5rem 1.5rem rgba(0, 0, 0, 0.75));
        }

        button.hire-me span[aria-hidden="true"]:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: hsl(var(--hue), var(--sat), var(--lum));
            clip-path: polygon(100% 0, 91% 91%, 13% 100%, 0 35%);
        }

        button.hire-me span[aria-hidden="true"]:nth-child(2) {
            --sat: 0%;
            --lum: 83%;
        }

        button.hire-me span[aria-hidden="true"]:nth-child(2):after {
            clip-path: polygon(3% 21%, 85% 25%, 75% 93%, 14% 87%);
        }

        button.hire-me span:last-child {
            background: radial-gradient(black, white 83%) 50% 0.125em / 0.5em 50%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(2px 2px #313131);
        }

        @keyframes floatText {
            0% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-15px)
            }

            100% {
                transform: translateY(0)
            }
        }


        .container {
            width: 300px;
            height: 300px;
            perspective: 1500px;
            z-index: 1;
        }


        #cube {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotateCube 5s linear infinite;

        }

        .face {
            position: absolute;
            width: 300px;
            height: 300px;
            background-position: center;
            background-size: cover;
            border: 2px solid #00ffcc;
        }

        .face:nth-child(1) {
            transform: rotateY(0deg) translateZ(150px);
            background-image: url("./hero1.jpg");
        }

        .face:nth-child(2) {
            transform: rotateY(90deg) translateZ(150px);

            background-image: url("./hero2.jpg");
        }

        .face:nth-child(3) {
            transform: rotateY(180deg) translateZ(150px);
            background-image: url("./hero1.webp");

        }

        .face:nth-child(4) {
            transform: rotateY(-90deg) translateZ(150px);
            background-image: url("./hero2.jpg");

        }

        @keyframes rotateCube {
            0% {
                transform: rotateX(10deg) rotateY(0deg);
            }

            100% {
                transform: rotateX(10deg) rotateY(90deg);

            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <a href="https://intiyajansarifullstackdeveloper.netlify.app/" style="text-decoration: none;">
                <h1>Intiyaj</h1>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Skills</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="hero">
        <div class="hero-text">
            <h2>Hello I'm <span>Intiyaj</span></h2>
            <p>Frontend Developer who loves building modern websites with animations and creative UI.</p>
            <button class="hire-me">
                <span aria-hidden="true">Hire Me</span>
                <span aria-hidden="true">Hire Me</span>
                <span>Hire Me</span>
            </button>
        </div>

        <div class="container">
            <div id="cube">
                <div class="face face1"></div>
                <div class="face face2"></div>
                <div class="face face3"></div>
                <div class="face face4"></div>
            </div>
        </div>
    </section>

    <section id="about-section">

    </section>

    <section id="contact-section">
        <div class="contact-form">
            <label for="">Name:</label>
            <input type="text" name="" id="" required>

            <label for="">Email Id:</label>
            <input type="email" name="" id="" required>

            <label for="">Mobile Number:</label>
            <input type="tel" name="" id="" required>

            <label for="">Message:</label>
            <textarea name="" id="" rows="3"></textarea>
        </div>
        <div class="follow-icon">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin"></i></a>
            <a href="#"><i class="fa-brands fa-github"></i></a>
        </div>
    </section>
</body>

</html>
