<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact-us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        .contact-container {
            height: 20vh;
            margin-top: 10px;
            margin-bottom: 50px;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <a href="https://intiyajansarifullstackdeveloper.netlify.app/" style="text-decoration: none;">
                <h1>Intiyaj</h1>
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Skills</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section id="contact-section">
        <section class="contact-container">
            <section class="section__container">

                <!-- CONTACT-US -->
                <div class="zigzag__container">
                    <div class="zigzag__item" style="--i:0;"><span><b>C</b></span></div>
                    <div class="zigzag__item" style="--i:1;"><span><b>O</b></span></div>
                    <div class="zigzag__item" style="--i:2;"><span><b>N</b></span></div>
                    <div class="zigzag__item" style="--i:3;"><span><b>T</b></span></div>
                    <div class="zigzag__item" style="--i:4;"><span><b>A</b></span></div>
                    <div class="zigzag__item" style="--i:5;"><span><b>C</b></span></div>
                    <div class="zigzag__item" style="--i:6;"><span><b>T</b></span></div>
                    <div class="zigzag__item" style="--i:7;"><span><b>-</b></span></div>
                    <div class="zigzag__item" style="--i:8;"><span><b>U</b></span></div>
                    <div class="zigzag__item" style="--i:9;"><span><b>S</b></span></div>
                </div>

                <!-- Bottom Border -->
                <div class="zigzag__container">
                    <div class="zigzag__item" style="--i:0;"></div>
                    <div class="zigzag__item" style="--i:1;"></div>
                    <div class="zigzag__item" style="--i:2;"></div>
                    <div class="zigzag__item" style="--i:3;"></div>
                    <div class="zigzag__item" style="--i:4;"></div>
                    <div class="zigzag__item" style="--i:5;"></div>
                    <div class="zigzag__item" style="--i:6;"></div>
                    <div class="zigzag__item" style="--i:7;"></div>
                    <div class="zigzag__item" style="--i:8;"></div>
                    <div class="zigzag__item" style="--i:9;"></div>
                </div>

            </section>
        </section>
        <div class="contact-form">
            <form action="">
                <label for="">Name:</label>
                <input type="text" name="" id="" required placeholder="Enter your name........">

                <label for="">Email Id:</label>
                <input type="email" name="" id="" required placeholder="Enter your email.......">

                <label for="">Mobile Number:</label>
                <input type="tel" name="" id="" required placeholder="Enter your mobile number.......">

                <label for="">Message:</label>
                <textarea name="" id="" placeholder="Enter your message......."></textarea>

                <div class="button-container">
                    <button class="btn cta bg">Sent Message</button>
                </div>
            </form>
            <div class="social-icons">

                <a href="https://www.instagram.com/" target="_blank">
                    <i class="fa-brands fa-instagram" style="color:#E4405F;"></i>&nbsp;&nbsp; Follow Intiyaj
                </a>

                <a href="https://www.linkedin.com/in/intiyaj-ansari/" target="_blank">
                    <i class="fa-brands fa-linkedin" style="color:#0A66C2;"></i>&nbsp;&nbsp; Connect with Intiyaj
                </a>

                <a href="https://github.com/Intiyaj-Raj" target="_blank">
                    <i class="fa-brands fa-github"></i> &nbsp;&nbsp;GitHub
                </a>

                <a href="tel:9117392461">
                    <i class="fa-solid fa-phone" style="color:#28a745;"></i> &nbsp;&nbsp;Call Intiyaj
                </a>

                <a href="https://wa.me/9117392461" target="_blank">
                    <i class="fa-brands fa-whatsapp" style="color:#25D366;"></i> &nbsp;&nbsp;Chat with Intiyaj
                </a>

                <a href="mailto:intiyajraj786@gmail.com">
                    <i class="fa-solid fa-envelope" style="color:#EA4335;"></i>&nbsp;&nbsp; Email Intiyaj
                </a>

            </div>
        </div>
    </section>
</body>

</html>
