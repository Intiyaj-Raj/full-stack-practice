<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        .main {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .img4 {
            grid-column: span 3;
        }

        img {
            width: 100%;
            object-fit: cover;
            height: 300px;
        }

        @media(max-width:550px) {
            .main {
                grid-template-columns: repeat(2, 1fr)
            }

            .img4 {
                grid-column: span 1;
            }

            img {
                height: 200px;
            }
        }
    </style>

</head>

<body>

    <div class="main">


        <div class="img1">
            <img src="https://picsum.photos/seed/pic2/300/200" alt="Image 2">
        </div>
        <div class="img2">
            <img src="https://picsum.photos/seed/pic1/300/200" alt="Image 1">
        </div>
        <div class="img3">
            <img src="https://picsum.photos/seed/pic33/300/200" alt="Image 3">
        </div>
        <div class="img4">
            <img src="https://picsum.photos/seed/pic4/300/200" alt="Image 4" class="img4">
        </div>
    </div>
</body>

</html>
