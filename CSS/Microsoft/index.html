<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to your account</title>
    <link rel="icon" href="./image/microsoft.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="main">
      <div class="logo">
        <img src="./image/logo.svg" alt="" />
      </div>
      <h2>Sign in</h2>
      <input
        type="text"
        name=""
        id="email"
        placeholder="Email, phone, or Skype"
      />
      <div class="links">
        <p>No account? <a href="#">Create one!</a></p>
        <a href="#" id="cant">Can't access your account?</a>
      </div>
      <div id="btnselect">
        <input type="button" value="Back" class="btn back" />
        <input type="button" value="Next" class="btn next" />
      </div>
    </div>
    <div class="sign">
      <span>
        <img src="./image/signin-options.svg" alt="" />
        Sign-in options
      </span>
    </div>
  </body>
</html>
