<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 25px;
        }

        .main {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 20% 1fr 1fr;
            grid-template-rows: 100px 200px 200px 100px;
        }

        header {
            background: green;
            grid-area: 1/1/2/4;
            color: white;
            text-align: center;
            padding-top: 40px;
        }

        aside {
            background: yellow;
            grid-area: 2/1/4/2;
            padding-top: 40px;
            text-align: center;
        }

        .content1 {
            background: rgb(47, 178, 201);
            grid-area: 2/2/3/4;
            padding-top: 40px;
            text-align: center;
        }

        .content2 {
            background: blue;
            grid-area: 3/2/4/3;
            padding-top: 40px;
            text-align: center;
        }

        .content3 {
            background: rgb(94, 154, 94);
            grid-area: 3/3/4/4;
            padding-top: 40px;
            text-align: center;
        }

        footer {
            background: #000;
            color: white;
            grid-area: 4/1/5/4;
            text-align: center;
            padding-top: 40px;
        }
    </style>
</head>

<body>
    <div class="main">
        <header>Header</header>
        <aside>Side Bar</aside>
        <div class="content1">Content 1</div>
        <div class="content2">Content 2</div>
        <div class="content3">Content 3</div>
        <footer>Footer</footer>
    </div>
</body>

</html>
