<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .square {
            width: 50px;
            height: 50px;
            border: 2px solid black;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        span {
            position: absolute;
            top: -12px;
            right: 1px;
            font-size: 30px;
            font-weight: bold;
        }

        .circle {

            width: 30px;
            height: 30px;
            border: 2px solid black;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="square">
        <div class="circle"></div>
        <span>.</span>
    </div>
</body>

</html>
