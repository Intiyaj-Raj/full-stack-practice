<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>italian-leather-perfume</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        nav {
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }

        .logo {
            width: 45%;
        }

        h3 {
            font-size: 1.17em;
            font-weight: bold;
        }

        .logo span {
            font-size: 11px;
            color: orangered;
            text-transform: uppercase;
        }

        .nav-btn {
            width: 60%;
        }

        .nav-btn ul {
            display: flex;
            list-style: none;
            width: 100%;
            justify-content: space-between;
        }

        a {
            text-decoration: none;
            color: white;

        }

        .hero-section {
            width: 100%;
            display: flex;
            padding: 20px 50px;
        }

        .hero-text,
        .hero-img {
            width: 50%;
        }


        .hero-img img {
            width: 50%;
        }
    </style>
</head>

<body>
    <div class="main">
        <nav>
            <div class="logo">
                <h3>Adze. <span>Design</span></h3>
            </div>
            <div class="nav-btn">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Interviews</a></li>
                    <li><a href="#"><i class="bi bi-search"></i></a></li>
                    <li><a href="#"><i class="bi bi-cart"></i></i></a></li>
                </ul>
            </div>
        </nav>

        <div class="hero-section">
            <div class="hero-text">
                <h2>Italian leather</h2>
                <h5>A Lucid Dream.</h5>

                <div class="hero-text-img">
                    <img src="./images/new1.webp" alt="">
                </div>

                <p>
                    Italian leather speaks the Italian of Rome, the one drowsily
                    murmured in the seat of a cabrilot
                </p>

                <h3>205.00 <i class="fa fa-euro"></i></h3>

                <span>
                    <img src="./image/home.png" alt="">
                    <img src="./image/images.jpg" alt="">
                </span>

                <span>
                    <button>Buy now</button>
                </span>
            </div>

            <div class="hero-img">
                <img src="./image/new1.webp" alt="">
            </div>
        </div>

    </div>
</body>

</html>
