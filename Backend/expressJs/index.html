<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>register form</title>
  </head>
  <body>
    <h1>GET Request Form</h1>
    <form method="get" action="http://localhost:3000/register">
      <input type="text" placeholder="enter username" name="user" />
      <input type="password" placeholder="enter password" name="password" />
      <button>Submit</button>
    </form>

    <h1>POST Request Form</h1>
    <form method="post" action="http://localhost:3000/register">
      <input type="text" name="user" placeholder="enter username" />
      <input type="password" placeholder="enter password" name="password" />
      <button>Submit</button>
    </form>
    
  </body>
</html>
