<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>blogging-website</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Knewave&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        .nav-link {
            color: white;
        }
    </style>
</head>

<body class="bg-black">
    <!-- Header -->
    <nav class="navbar navbar-expand-lg fixed-top ">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <img src="./image/logo.png" alt="logo">
            </a>

            <!-- Toggle button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto gap-2ewwww fw-semibold">
                    <li class="nav-item"><a class="nav-link " href="#hero">Home</a></li>
                    <li class="nav-item"><a class="nav-link " href="#about">About Us</a></li>
                    <li class="nav-item"><a class="nav-link " href="#our-category">Our Category</a></li>
                    <li class="nav-item"><a class="nav-link " href="#best">Best</a></li>
                    <li class="nav-item"><a class="nav-link " href="#testimonials">Testimonials</a></li>
                    <li class="nav-item"><a class="nav-link " href="#contact">Contact</a></li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- contact form -->
    <section id="contact-us">
        <div class="container my-5 p-5">
            <h1 class="text-light text-center my-3">Contact Us</h1>

            <form class="row g-3 text-white">
                <div class="col-md-6">
                    <label for="inputName" class="form-label">Name:</label>
                    <input type="text" class="form-control" id="inputName" placeholder="Enter your name.....">
                </div>
                <div class="col-md-6">
                    <label for="inputContact" class="form-label">Phone:</label>
                    <input type="tel" class="form-control" id="inputContact" placeholder="Enter your phone number.....">
                </div>
                <div class="col-md-12">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input type="email" class="form-control" id="inputEmail4" placeholder="Enter your email.....">
                </div>
                <div class="col-12">
                    <label for="inputAddress" class="form-label">Address:</label>
                    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St.....">
                </div>
                <div class="col-md-6">
                    <label for="inputCity" class="form-label">City:</label>
                    <input type="text" class="form-control" id="inputCity" placeholder="Enter your city.....">
                </div>
                <div class="col-md-4">
                    <label for="inputState" class="form-label">State:</label>
                    <input type="text" class="form-control" id="inputState" placeholder="Enter your state.....">
                </div>
                <div class="col-md-2">
                    <label for="inputZip" class="form-label">Zip:</label>
                    <input type="text" class="form-control" id="inputZip" placeholder="Enter your zip code.....">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-outline-primary">Submit</button>
                </div>
            </form>
        </div>
    </section>


    <footer class="bg-dark text-white pt-5 pb-3">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-4">
                    <h2 class="fw-bold text-success" style="font-family:Knewave; font-weight: 400; font-style: normal;">
                        Flower Blooms</h2>
                    <p class=" fw-medium text-white">
                        We provide fresh flowers for every special moment.
                        Make your day beautiful with us.
                    </p>
                </div>

                <div class="col-md-4">
                    <h5 class="fw-bold">Quick Links</h5>
                    <ul class="list-unstyled">
                        <li><a href="#hero" class="text-decoration-none text-white">Home</a></li>
                        <li><a href="#about" class="text-decoration-none text-white">About</a></li>
                        <li><a href="#" class="text-decoration-none text-white">Featured</a></li>
                        <li><a href="#" class="text-decoration-none text-white">Contact</a></li>
                    </ul>
                </div>

                <div class="col-md-4">
                    <h5 class="fw-bold">Follow Us</h5>
                    <a href="#" class="text-white me-3 fs-5"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-white me-3 fs-5"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-white me-3 fs-5"><i class="bi bi-twitter"></i></a>
                </div>

            </div>

            <hr class="border-light mt-4">
            <p class="text-center mb-0">
                © 2026 Fresh Blooms | All Rights Reserved
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
