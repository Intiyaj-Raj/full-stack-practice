<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background: lightblue;
            padding: 50px;
        }

        .box h1 {
            color: red;
        }

        .in-box .greet {
            color: green;
        }

        .greet,
        #greet {
            color: rgb(17, 0, 128);
        }

        .greet2 {
            color: yellow;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Hello</h1>
        <div class="in-box">
            <h1 class="greet">greet</h1>
            <h1 id="greet">greet</h1>
        </div>
        <h1 class="greet2">greet2</h1>
    </div>
</body>

</html>
