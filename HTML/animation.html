<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            /* width: 100%;
            display: flex;
            justify-content: center; */
            height: 200px;
            width: 200px;
            margin-top: 100px;
            /* animation: rotate 10s li  delay iteration-count direction fill-mode; */
            animation-name: rotate;
            animation-duration: 4s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        img {
            border-radius: 50%;
            height: 200px;
            width: 200px;
        }

        @keyframes rotate {

            /* to {
                transform: translateX(0)
            }

            from {
                transform: translateX(-50px)
            } */


            0% {
                background-image: url("https://tse2.mm.bing.net/th/id/OIP.s2L7-YUGb2sK_fYrEIzinwHaFj?pid=Api&P=0&h=180");
            }

            50% {
                background-image: url("https://tse2.mm.bing.net/th/id/OIP.t57OzeATZKjBDDrzXqbc5gHaE7?pid=Api&P=0&h=180");
            }

            100% {
                background-image: url("aksjdf");
                background-color: red;
            }
        }

        .box1 {
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            transition-property: all;
            transition-duration: 2s;
            transition-timing-function: ease-in;
        }

        h1:hover {
            color: red;
            background: #000;
        }
    </style>
</head>

<body>
    <div class="box">
        <!-- <img src="" alt=""> -->
    </div>

    <div class="box1">
        <h1>Hello </h1>
    </div>
</body>

</html>
