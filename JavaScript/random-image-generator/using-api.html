<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(222, 227, 233);
        }

        div {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        img {
            width: 50%;
            height: 350px;
            object-fit: cover;
            object-position: center;
        }

        button {
            margin-top: 20px;
            padding: 8px 20px;
            font-weight: bold;
            background: black;
            color: white;
            cursor: pointer;
        }


        button:active {
            background: blue;
            color: black;
        }
    </style>
</head>

<body>

    <div>
        <h2>Image Generator</h2>
        <img src="./image/1.jpg" alt="" id="image">
        <button onclick="handleImage()">Change Image</button>
    </div>

    <script>

        function handleImage() {
            let image = document.getElementById("image")

            let randNum = Math.floor(Math.random() * 1000);
            console.log(randNum)

            image.src = "https://picsum.photos/400/300?random=" + randNum

        }
    </script>
</body>

</html>
