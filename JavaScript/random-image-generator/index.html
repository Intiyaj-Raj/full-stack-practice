<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Random Image Generator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        img {
            width: 400px;
            height: 300px;
            object-fit: cover;
            margin-top: 20px;
            border-radius: 10px;
            border: 3px solid #00f0ff;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #ff00d4;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1>Random Image Generator</h1>

    <img id="randomImage" src="https://picsum.photos/400/300" alt="Random Image">

    <br>

    <button onclick="generateImage()">Generate New Image</button>

    <script>
        function generateImage() {
            let img = document.getElementById("randomImage");

            // change image with random parameter
            img.src = "https://picsum.photos/400/300?random=" + Math.floor(Math.random() * 1000);
        }
    </script>

</body>

</html>
