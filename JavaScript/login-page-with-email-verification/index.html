<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-otp-verify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            background-image: url("./bgImg.png");
            height: 100vh;
            background-size: cover;
            background-position: center;
        }

        .box {
            height: 100vh;
            background: rgb(0, 0, 0, .2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: rgb(212, 212, 238, 0.5);
            height: 90vh;
            width: 450px;
            border-radius: 20px 0px 20px 0px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">

            <div class="form-container">
                <form action="">
                    <input type="email" name="" id="" required placeholder="Enter Your Email Id">

                    <input type="password" name="" id="pass" required placeholder="Enter Your Password">

                    <input type="text" name="" id="opt" required placeholder="Enter Your Otp">

                    <button id="sendBtn">Send Otp</button>
                    <button id="loginBtn">Login</button>
                </form>
            </div>

        </div>
    </div>
</body>

</html>
