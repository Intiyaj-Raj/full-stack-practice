<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="./style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login-otp-verify</title>

</head>

<body>
    <div class="container">
        <div class="box">

            <div class="form-container">
                <form action="">
                    <input type="email" name="" id="" required placeholder="Enter Your Email Id">

                    <input type="password" name="" id="pass" required placeholder="Enter Your Password">

                    <input type="text" name="" id="opt" required placeholder="Enter Your Otp">

                    <div class="btn">
                        <button id="sendBtn">Send Otp</button>
                        <button id="loginBtn">Login</button>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="./script.js"></script>
</body>

</html>
