<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Grid Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            padding: 40px;
            font-family: Arial, sans-serif;
        }

        .parent {
            max-width: 1400px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 300px;
            gap: 16px;
        }

        .parent div {
            overflow: hidden;
            border-radius: 24px;
            position: relative;
            cursor: pointer;
            background: #111;
        }

        .parent img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .6s ease;

            animation: revealImage 1.5s cubic-bezier(.22, .61, .36, 1) forwards;
            opacity: 0;
        }

        .parent div:hover img {
            transform: scale(1.1);
        }

        @keyframes revealImage {
            0% {
                clip-path: inset(45% 45% 45% 45% round 20px);
                transform: scale(1.4);
                opacity: 0;
            }

            100% {
                clip-path: inset(0% 0% 0% 0% round 24px);
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Stagger Animation */

        .div1 img {
            animation-delay: .1s;
        }

        .div2 img {
            animation-delay: .2s;
        }

        .div3 img {
            animation-delay: .3s;
        }

        .div4 img {
            animation-delay: .4s;
        }

        .div5 img {
            animation-delay: .5s;
        }

        .div6 img {
            animation-delay: .6s;
        }

        .div7 img {
            animation-delay: .7s;
        }

        .div8 img {
            animation-delay: .8s;
        }

        .div9 img {
            animation-delay: .9s;
        }

        .div10 img {
            animation-delay: 1s;
        }

        .div11 img {
            animation-delay: 1.1s;
        }

        /* Grid Layout */

        .div3 {
            grid-column: span 2;
        }

        .div4 {
            grid-column-start: 4;
            grid-row-start: 2;
        }

        .div5 {
            grid-column-start: 1;
            grid-row-start: 2;
        }

        .div6 {
            grid-column-start: 2;
            grid-row-start: 2;
        }

        .div7 {
            grid-column-start: 3;
            grid-row-start: 2;
        }

        .div8 {
            grid-column-start: 4;
            grid-row-start: 3;
        }

        .div9 {
            grid-column-start: 1;
            grid-row-start: 3;
        }

        .div10 {
            grid-column-start: 2;
            grid-row-start: 3;
        }

        .div11 {
            grid-column-start: 3;
            grid-row-start: 3;
        }

        @media (max-width: 992px) {
            .parent {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 250px;
            }

            .parent div {
                grid-column: auto !important;
                grid-row: auto !important;
            }

            .div3 {
                grid-column: span 2 !important;
            }
        }

        @media (max-width: 600px) {
            .parent {
                grid-template-columns: 1fr;
            }

            .div3 {
                grid-column: span 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="parent">

        <div class="div1">
            <img src="https://picsum.photos/id/1015/800/800" alt="">
        </div>

        <div class="div2">
            <img src="https://picsum.photos/id/1025/800/800" alt="">
        </div>

        <div class="div3">
            <img src="https://picsum.photos/id/1035/1200/800" alt="">
        </div>

        <div class="div4">
            <img src="https://picsum.photos/id/1040/800/800" alt="">
        </div>

        <div class="div5">
            <img src="https://picsum.photos/id/1050/800/800" alt="">
        </div>

        <div class="div6">
            <img src="https://picsum.photos/id/1060/800/800" alt="">
        </div>

        <div class="div7">
            <img src="https://picsum.photos/id/1070/800/800" alt="">
        </div>

        <div class="div8">
            <img src="https://picsum.photos/id/1080/800/800" alt="">
        </div>

        <div class="div9">
            <img src="https://picsum.photos/id/1090/800/800" alt="">
        </div>

        <div class="div10">
            <img src="https://picsum.photos/id/110/800/800" alt="">
        </div>

        <div class="div11">
            <img src="https://picsum.photos/id/111/800/800" alt="">
        </div>

    </div>

</body>

</html>
