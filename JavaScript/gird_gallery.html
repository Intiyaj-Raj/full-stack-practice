<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Grid Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            min-height: 100vh;
            padding: 40px;
            font-family: Arial, sans-serif;
        }

        .parent {
            max-width: 1400px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 300px;
            gap: 16px;
        }

        .parent div {
            overflow: hidden;
            border-radius: 24px;
            position: relative;
            cursor: pointer;
            background: #111;
        }

        .parent img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: all .6s ease;
        }

        .parent div:hover img {
            transform: scale(1.1);
        }

        .parent div::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(0, 0, 0, .5),
                    transparent);
            z-index: 1;
        }

        /* Grid Layout */

        .div3 {
            grid-column: span 2;
        }

        .div4 {
            grid-column-start: 4;
            grid-row-start: 2;
        }

        .div5 {
            grid-column-start: 1;
            grid-row-start: 2;
        }

        .div6 {
            grid-column-start: 2;
            grid-row-start: 2;
        }

        .div7 {
            grid-column-start: 3;
            grid-row-start: 2;
        }

        .div8 {
            grid-column-start: 4;
            grid-row-start: 3;
        }

        .div9 {
            grid-column-start: 1;
            grid-row-start: 3;
        }

        .div10 {
            grid-column-start: 2;
            grid-row-start: 3;
        }

        .div11 {
            grid-column-start: 3;
            grid-row-start: 3;
        }

        /* Tablet */

        @media(max-width:992px) {

            .parent {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 250px;
            }

            .parent div {
                grid-column: auto !important;
                grid-row: auto !important;
            }

            .div3 {
                grid-column: span 2 !important;
            }
        }

        /* Mobile */

        @media(max-width:600px) {

            .parent {
                grid-template-columns: 1fr;
            }

            .div3 {
                grid-column: span 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="parent">

        <div class="div1">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200" alt="">
        </div>

        <div class="div2">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=1200" alt="">
        </div>

        <div class="div3">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600" alt="">
        </div>

        <div class="div4">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200" alt="">
        </div>

        <div class="div5">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200" alt="">
        </div>

        <div class="div6">
            <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=1200" alt="">
        </div>

        <div class="div7">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1200" alt="">
        </div>

        <div class="div8">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1200" alt="">
        </div>

        <div class="div9">
            <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=1200" alt="">
        </div>

        <div class="div10">
            <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?w=1200" alt="">
        </div>

        <div class="div11">
            <img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=1200" alt="">
        </div>

    </div>

</body>

</html>
