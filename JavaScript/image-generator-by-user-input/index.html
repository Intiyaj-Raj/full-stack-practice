<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagegenerator</title>

    <style>
        .box {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #img-card {
            width: 60%;
            height: 450px;
            background-size: cover;
            background-position: center;
            margin-top: 10px;
        }


        input {
            padding: 8px 10px;
            outline: none;
            width: 200px;
        }

        button {
            padding: 8px 10px;
            background: black;
            color: white;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            border: none;
        }

        button:active {
            color: blue;
            background: red;
        }

        @media (max-width:600px) {
            #img-card {
                width: 90%;
                height: 75vh;
            }

        }
    </style>
</head>

<body>

    <div class="box">
        <div style="display: flex;">
            <input type="number" id="userInput" placeholder="Enter Number....">
            <button onclick="handleClick()">Generate Image</button>
        </div>
        <h4 id="imgLinkText">Image Link:
            &nbsp;<a href="" id="imgLink" target="_blank">link is generated after enter the number</a>
        </h4>
        <div id="img-card"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
