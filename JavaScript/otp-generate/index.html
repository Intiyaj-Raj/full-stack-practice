<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>otpgenerator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(176, 209, 234);
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        hr {
            border: none;
            height: 3px;
            background: linear-gradient(to right, red, yellow, green);
        }

        div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            justify-content: center;
            padding: 20px;
        }

        button {
            padding: 8px 10px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
            transition: all .3s linear;
        }

        h3 {
            color: blue;
            border-bottom: 2px solid green;
            padding: 3px 10px;
        }

        #showOtp {
            background: green;
            color: white;
            letter-spacing: 5px;
            text-align: center;
            padding: 8px 40px;
        }

        button:hover {
            background: #000;
            color: white;
        }
    </style>

</head>

<body>

    <h1>OTP GENERATOR</h1>
    <hr>

    <div>

        <h3>4 Digit Otp Generator</h3>
        <h4 id="showOtp">XXXX</h4>
        <button onclick="handleBtn()">Generate Otp</button>

    </div>

    <script src="script.js"></script>
</body>

</html>
