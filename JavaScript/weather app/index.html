<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ritendra gour">
    <meta name="keywords" content="weather">
    <meta name="author" content="ritendra gour">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <title>Weather APP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <form>
            <input type="text" class="form-control" placeholder="Enter City Name">
            <div class="right">
                <button class="btn btn-primary">Search Weather</button>
            </div>
        </form>
    </div>
    <div class="ans">
        <span>
            <span class="main">
                <img id="img">
                <h1 id="tempC"></h1>
                <h1><sup> &nbsp;o</sup>C&nbsp;&nbsp;</h1>
            </span>
            <span style="display: flex;">
                <h2 id="tempF"></h2>
                <h2><sup> &nbsp;o</sup>F</h2>
            </span>
            <span id="locationFamily">
                <h2 id="cityName"></h2>
                <h2 id="state"></h2>
                <h2 id="country"></h2>
            </span>
        </span>
        <span class="mainSide">
            <h3 id="lastUpdateTimeDate" class="btn btn-danger"></h3>
            <h3 id="state"></h3>
            <h3 id="country"></h3>
            <h3 id="time"></h3>
            <h3 id="date"></h3>
            <h3 id="timeZone"></h3>
        </span>
    </div>
    <script src="main.js">

    </script>
</body>

</html>
