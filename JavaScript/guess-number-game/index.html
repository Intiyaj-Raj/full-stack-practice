<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guess-number-game</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="box">
                <p>I have a random number</p>
                <p>between 1 - 100</p>

                <p>Dare to Guess ?</p>

                <button id="nBtn" onclick="newGame()">New Game</button>
            </div>
            <div class="box">
                Enter your guess below & press enter
                <span>
                    <input type="number" name="" id="userInput">
                    <button onclick="handleGuess()" id="guessBtn">Guess</button>
                    <button id="newBtn2" onclick="newGame()">New Game</button>
                </span>
                <p id="result">Wrong answer</p>
                <p id="attempt">Total Chances: 5</p>
            </div>
            <div class="box">
                <p id="prevGuess">Your previous guesses:....</p>
            </div>
        </div>
    </div>


    <script src="./script.js"></script>

</body>

</html>
