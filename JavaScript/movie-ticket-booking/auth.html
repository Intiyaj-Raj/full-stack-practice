<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>movie-ticket-booking-app-authenticaton</title>
    <link rel="stylesheet" href="./style.css">

    <style>

    </style>
</head>

<body>

    <div class="login-container">
        <h2>Book MY Show</h2>
        <input type="text" name="" id="username" placeholder="username or email">
        <input type="password" name="" id="loginPassword" placeholder="password">

        <div class="loginBtn">
            <button onclick="signup()">Sign up</button>
            <button onclick="login()">Login</button>
        </div>
    </div>

    <script>
        function signup() {
            let username = document.getElementById("username").value
            let password = document.getElementById("loginPassword").value

            if (username && password) {
                localStorage.setItem("user", JSON.stringify({ username, password }))
                alert("sign up successfully")
            }
        }

        function login() {
            let username = document.getElementById("username").value
            let password = document.getElementById("loginPassword").value

            let saved = JSON.parse(localStorage.getItem("user"));
            if (saved && saved.username === username && saved.password === password) {
                localStorage.setItem("loggedInUser", username);
                window.location.href = "index.html"
            }
        }
    </script>

</body>

</html>
