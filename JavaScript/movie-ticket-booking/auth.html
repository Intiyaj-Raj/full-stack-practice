<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App Auth</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .signUpContainer {
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Book MY Show</h2>

        <!-- LOGIN -->
        <div id="loginBox">
            <input type="text" id="loginUsername" placeholder="username or email">
            <input type="password" id="loginPassword" placeholder="password">

            <button onclick="showSignup()">Sign up</button>
            <button onclick="login()">Login</button>
        </div>


        <!-- sign up page -->
        <div class="signUpContainer" id="signupBox">
            <input type="text" id="signupUsername" placeholder="enter your email">
            <input type="password" id="signupPassword" placeholder="password">
            <input type="tel" id="usermob" placeholder="mobile number">
            <input type="text" name="" id="otp" placeholder="Enter Your Otp">
            <button onclick="sendOtp()">Send OTP</button>
            <button onclick="signup()">Create Account</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <script>
        // init emailjs
        (function () {
            emailjs.init("9JIMT7L0LnqOStK5U");
        })();

        let generatedOtp = "";

        // Send OTP
        async function sendOtp() {
            let email = document.getElementById("signupUsername").value;

            if (!email) {
                alert("Enter email first");
                return;
            }

            generatedOtp = Math.floor(1000 + Math.random() * 9000);

            try {
                await emailjs.send("service_b02fh38", "template_ex47e8g", {
                    to_email: email,
                    otp: generatedOtp
                });

                alert("OTP sent successfully ✅");

            } catch (error) {
                console.log(error);
                alert("Failed to send OTP ❌");
            }
        }

        function showSignup() {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("signupBox").style.display = "block";
        }

        // signup with OTP verify
        function signup() {
            let username = document.getElementById("signupUsername").value;
            let password = document.getElementById("signupPassword").value;
            let mobile = document.getElementById("usermob").value;
            let userOtp = document.getElementById("otp").value;

            if (!username || !password || !mobile || !userOtp) {
                alert("Fill all fields");
                return;
            }

            if (userOtp != generatedOtp) {
                alert("Wrong OTP ❌");
                return;
            }

            localStorage.setItem("user", JSON.stringify({ username, password }));

            alert("Signup successful ✅");

            document.getElementById("signupBox").style.display = "none";
            document.getElementById("loginBox").style.display = "block";
        }

        function login() {
            let username = document.getElementById("loginUsername").value;
            let password = document.getElementById("loginPassword").value;

            let saved = JSON.parse(localStorage.getItem("user"));

            if (saved && saved.username === username && saved.password === password) {
                localStorage.setItem("loggedInUser", username);
                window.location.href = "index.html";
            } else {
                alert("Invalid username or password");
            }
        }
    </script>

</body>

</html>
