<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>raj-login</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <h2>Login to See the Magic</h2>
        <h1>System Login</h1>

        <form id="lform">

            <label>Email</label>
            <input type="text" id="email" placeholder="Enter email">

            <label>Password</label>
            <input type="password" id="pass" placeholder="Enter password">

            <div id="question">

                <p style="color:blue;margin:8px 0;">Are you human?</p>
                <img src="./qimg.png">

                <textarea rows="3"
                    placeholder='If you cannot solve this, write "I miss you" and the login page will open.'
                    id="ans"></textarea>

            </div>

            <button type="button" onclick="loginPage()">Login</button>

        </form>

        <div id="enter-answer">
            Please answer the question to continue.
        </div>

        <div id="right">
            Please enter the correct answer to continue.
        </div>

        <div class="succes">
            ACCESS GRANTED ✅
        </div>

        <div class="denied">
            ❌ All fields are required. Please complete the form.
        </div>

        <div id="link">
            <a href="./love.html">Click here to see a message for you 💖</a>
        </div>

    </div>

    <script src="./script.js"></script>
</body>

</html>
