<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form id="validationForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                <span class="error" id="fullNameError">Name is required</span>
                <span class="success" id="fullNameSuccess">Name is valid!</span>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <span class="error" id="emailError">Please enter a valid email</span>
                <span class="success" id="emailSuccess">Email is valid!</span>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
                <span class="error" id="passwordError">Password must be 8+ chars with uppercase & number</span>
                <span class="success" id="passwordSuccess">Strong password!</span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password"
                    required>
                <span class="error" id="confirmPasswordError">Passwords do not match</span>
                <span class="success" id="confirmPasswordSuccess">Passwords match!</span>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit phone" required>
                <span class="error" id="phoneError">Enter valid 10-digit phone number</span>
                <span class="success" id="phoneSuccess">Phone is valid!</span>
            </div>



            <button type="submit" id="submitBtn">Register</button>

            <div id="message" class="message"></div>
        </form>
    </div>

    <script src="./script.js"></script>
</body>

</html>
