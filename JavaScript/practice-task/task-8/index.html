<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="container">
        <div class="box">
            <p id="passAlert">Enter minimum 10 digit password</p>
            <input type="password" name="" id="pass" onclick="handleInput()" placeholder="Enter password" maxlength="12"
                oninput="handlePass()">
            <i class="fa-solid fa-check" id="checkIcon"></i>
            <i class="fas fa-spinner fa-spin" id="spinner"></i>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
