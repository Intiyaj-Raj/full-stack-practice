<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <input type="number" name="" id="userInput" placeholder="enter a number: ">
    <button onclick="handleClick()">Find Factorial</button>

    <p id="result" style="font-weight: bold;"></p>


    <script>
        function handleClick() {
            let num = Number(document.getElementById('userInput').value)
            let result = document.getElementById("result")
            console.log(num)
            let fact = 1;

            if (num >= 0) {
                for (let i = 1; i <= num; i++) {
                    fact = fact * i;
                }
                result.innerHTML = `factorial of ${num} = ${fact}`
                result.style.color = "green"
            }
            else {
                result.innerHTML = `please enter a positive number`
                result.style.color = "red"
            }
        }
    </script>
</body>

</html>
