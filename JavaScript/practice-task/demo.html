<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="heading">
        <h1>Address Maker</h1>
        <h6>An Online Address Creator Tool</h6>
    </div>

    <form action="">
        <label for="">Name:</label>
        <input type="text" name="" id="name">

        <label for="">Mobile No.:</label>
        <input type="tel" name="" id="mob">

        <label for="">Alternate Mobile No.:</label>
        <input type="tel" name="" id="amob">

        <label for="">Email:</label>
        <input type="email" name="" id="emailId">

        <label for="">Address</label>
        <textarea: id="add"></textarea:>
    </form>
</body>

</html>
