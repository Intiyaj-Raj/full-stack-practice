<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Swap number</h1>

    <input type="text" name="" id="num1" placeholder="Enter number1">
    <input type="text" name="" id="num2" placeholder="Enter number2">
    <br><br>
    <button onclick="handleClick()">Check No.</button>


    <h3 id="result1"></h3>
    <h3 id="result2"></h3>


    <h4 id="result3"></h4>
    <h4 id="result4"></h4>

    <script>

        function handleClick() {

            let num1 = Number(document.getElementById("num1").value)
            let num2 = Number(document.getElementById("num2").value)

            // org value
            let result1 = document.getElementById("result1")
            let result2 = document.getElementById("result2")

            result1.innerText = `num1 = ${num1}`
            result2.innerText = `num2 = ${num2}`


            // change value 
            let result3 = document.getElementById("result3")
            let result4 = document.getElementById("result4")

            num1 = num1 + num2
            num2 = num1 - num2
            num1 = num1 - num2

            result3.innerText = `num1 = ${num1}`
            result4.innerText = `num2 = ${num2}`

        }

    </script>
</body>

</html>
