<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        input {
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <input type="text" name="" id="num1" placeholder="Enter number1........">
    <br>
    <input type="text" name="" id="num2" placeholder="Enter number2........">
    <br>
    <input type="text" name="" id="num3" placeholder="Enter number3........">
    <br>
    <button onclick="handleClick()"> Find Max </button>

    <h5 id="result"></h5>

    <script>

        function handleClick() {
            let n1 = Number(document.getElementById("num1").value)
            let n2 = Number(document.getElementById("num2").value)
            let n3 = Number(document.getElementById("num3").value)

            let result = document.getElementById("result")

            if (n1 > n2 && n1 > n3) {
                result.innerHTML = `${n1} is greater than ${n2} and ${n3}`
            }
            else if (n2 > n1 && n2 > n3) {
                result.innerHTML = `${n2} is greater than ${n1} and ${n3}`
            }
            else if (n3 > n1 && n3 > 2) {
                result.innerHTML = `${n3} is greater than ${n1} and ${n2}`
            }

            else {
                result.innerHTML = "all numbers are equal"
            }

        }

    </script>

</body>

</html>
