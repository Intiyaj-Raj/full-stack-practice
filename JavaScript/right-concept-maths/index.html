<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Syne:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader-ring"></div>
        <div class="loading-text">Initializing Experience...</div>
    </div>

    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Grid Overlay -->
    <div class="grid-overlay"></div>


    <!-- main container -->

    <div class="main">

        <!-- header section -->
        <header>
            <div class="logo">
                <img src="./image/logo.png" alt="">
            </div>
            <h2>Right Concept Of Mathematics</h2>
            <h4>By N.M Sir</h4>
        </header>


        <!-- hero section -->
        <section>
            <div class="menu-grid" id="menuGrid" style="display: grid;">
                <div class="menu-item visible" data-section="introduction"
                    style="animation: auto ease 0s 1 normal none running none;">
                    <div class="menu-badge">IN</div>
                    <div class="menu-title">Introduction</div>
                </div>
                <div class="menu-item visible" data-section="services"
                    style="animation: auto ease 0s 1 normal none running none;">
                    <div class="menu-badge">SV</div>
                    <div class="menu-title">Services</div>
                </div>
                <div class="menu-item visible" data-section="gallery"
                    style="animation: auto ease 0s 1 normal none running none;">
                    <div class="menu-badge">RT</div>
                    <div class="menu-title">Result</div>
                </div>
                <div class="menu-item visible" data-section="testimonials"
                    style="animation: auto ease 0s 1 normal none running none;">
                    <div class="menu-badge">TM</div>
                    <div class="menu-title">Testimonials</div>
                </div>
                <div class="menu-item visible" data-section="about"
                    style="animation: auto ease 0s 1 normal none running none;">
                    <div class="menu-badge">AB</div>
                    <div class="menu-title">About</div>
                </div>
                <div class="menu-item visible" data-section="contact"
                    style="animation: auto ease 0s 1 normal none running none;">
                    <div class="menu-badge">CT</div>
                    <div class="menu-title">Contact</div>
                </div>
            </div>
        </section>

        <!-- footer section -->

    </div>

    <script src="./script.js"></script>
</body>

</html>
