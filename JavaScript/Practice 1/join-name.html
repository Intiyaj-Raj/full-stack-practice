<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #btn {
            padding: 3px 15px;
            border: 1px solid black;
            outline: none;
        }
    </style>
</head>

<body>
    <label for="">First Name: </label>
    <input type="text" name="" id="fname" placeholder="Enter Your First Name">
    <br><br>
    <label for="">Last Name: </label>
    <input type="text" name="" id="lname" placeholder="Enter Your Last Name ">
    <br><br>
    <button id="btn" onclick="handleBtn()">Send</button>
    <h2 id="JoinName"></h2>



    <script>


        function handleBtn() {
            let fname = document.getElementById("fname").value
            let lname = document.getElementById("lname").value
            let JoinName = document.getElementById("JoinName");


            JoinName.innerHTML = `Your Name is: ${fname}  ${lname}`
        }

    </script>
</body>

</html>
