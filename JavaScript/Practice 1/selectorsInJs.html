<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="int"></h1>

    <h2 id="greetingMsg"></h2>
    <button onclick="clickbtn()">Click Me</button>
    <script>
        let heading = document.getElementById("int")
        heading.innerHTML = 'Intiyaj Ansari'

        heading.style.color = "red"
        heading.style.background = "black"
        heading.style.padding = "30px 20px"
        heading.style.borderRadius = "50%"
        heading.style.textAlign = "center"

        function clickbtn() {
            let a = document.getElementById("greetingMsg")
            a.innerHTML = "Hii"
        }
    </script>
</body>

</html>
