<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url("./bg.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            width: 100%;
            height: 100vh;
            background-position: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 60%;
            height: 95vh;
            background: rgba(2, 2, 43, 0.8);
            border-radius: 10px;
            box-shadow: -3px 1px 13px 5px rgba(0, 0, 0, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .box {
            background: yellow;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 85%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: -1px 1px 13px 1px rgb(203, 200, 8);
        }

        .box p {
            line-height: 1.5;
        }

        .box button {
            margin: 10px 0;
            padding: 6px;
            width: 150px;
            cursor: pointer;
        }

        .box input {
            padding: 6px;
            margin: 10px;
            width: 50%;
            outline: none;

        }

        @media (max-width:650px) {
            .card {
                width: 90%;
            }

            .box input {
                width: 90%;

            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="box">
                <p>I have a random number</p>
                <p>between 1 - 100</p>

                <p>Dare to Guess ?</p>

                <button>New Game</button>
            </div>
            <div class="box">
                Enter your guess below & press enter
                <input type="number" name="" id="userInput">
                <p>Number of previous attempts: 0</p>
            </div>
            <div class="box">
                <p>Your previous guesses: </p>
            </div>
        </div>
    </div>


    <script>

        function handleGuess() {
            let randNum = Math.floor(Math.random() * 100) + 1;
            console.log(randNum)
        }

    </script>

</body>

</html>
