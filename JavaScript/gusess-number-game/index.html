<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url("./bg.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            width: 100%;
            height: 100vh;
            background-position: center;
            font-family: sans-serif;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 60%;
            height: 95vh;
            background: rgba(2, 2, 43, 0.8);
            border-radius: 10px;
            box-shadow: -3px 1px 13px 5px rgba(0, 0, 0, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .box {
            background: yellow;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 85%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: -1px 1px 13px 1px rgb(203, 200, 8);
        }

        .box p {
            line-height: 1.5;
        }

        #nBtn {
            margin: 10px 0;
            padding: 6px;
            width: 150px;
            cursor: pointer;
        }

        span {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        span input,
        span button {
            padding: 6px;
            outline: none;
            border: none;
            margin: 10px 0;
        }

        span input {
            border-radius: 5px 0 0 5px;
        }

        span button {
            background: blue;
            color: white;
            font-weight: 550;
            padding: 6px 20px;
            border-radius: 0 5px 5px 0;
            cursor: pointer;

        }


        span button:active {
            color: blue;
            background: rgb(101, 101, 101);
        }

        #result {
            color: red;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 3px;
            font-weight: 500;
            margin: 10px 0;
        }

        @media (max-width:650px) {
            .card {
                width: 90%;
            }

            .box input {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="box">
                <p>I have a random number</p>
                <p>between 1 - 100</p>

                <p>Dare to Guess ?</p>

                <button id="nBtn">New Game</button>
            </div>
            <div class="box">
                Enter your guess below & press enter
                <span>
                    <input type="number" name="" id="userInput">
                    <button onclick="handleGuess()">Guess</button>
                </span>
                <p id="result">Wrong answer</p>
                <p id="attempt"></p>
            </div>
            <div class="box">
                <p id="prevGuess">Your previous guesses:....</p>
            </div>
        </div>
    </div>


    <script>
        let randNum = Math.floor(Math.random() * 100) + 1;
        console.log(randNum)

        let attempts = 0;
        let maxAttempt = 5;

        function handleGuess() {
            let result = document.getElementById("result")
            let inputValue = Number(document.getElementById("userInput").value)
            let showAttempt = document.getElementById("attempt")

            let prevGuess = document.getElementById("prevGuess")

                result.innerHTML = `Bhai Chance Khatam ho gaya 😀 Answer = ${randNum}`
            }

            attempts++;
            if (attempts <= 5) {
                showAttempt.innerHTML = `Number of attempts: ${attempts}`

            }
            else if (inputValue > randNum) {
                result.innerHTML = "Number is too high 🤔"
                attempt.innerHTML = count;
            }
            else if (inputValue < randNum) {

            }
            else if (count == 5) {
                result.innerHTML = "Game Loss"
                result.innerHTML = `Answer = ${randNum}`
                attempt.innerHTML = count;
            }

            // prevGuess.innerHTML = `Your previous guesses: ${inputValue}`;

    </script>

</body>

</html>
